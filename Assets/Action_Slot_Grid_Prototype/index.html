    .cell-left { text-align: left; }

    .content-group-left { justify-content: flex-start; }

    .action-wrapper { flex-shrink: 0; display: flex; align-items: center; z-index: 1; }
    .hover-action { opacity: 0; transition: opacity 0.15s ease; }
    .abs-left { position: absolute; left: 8px; top: 12px; }
    .abs-right { position: absolute; right: 8px; top: 12px; }

    .warning-badge-icon { color: #d13438; cursor: pointer; }

    .controls-toggle {
      display: flex; align-items: center; gap: 8px; padding: 8px 16px;

      background: none; border: none; width: 100%; text-align: left;

      { Id: 1015, Status: 'Paused', Name: 'Q1 2026 Product Launch Global Awareness Performance Max With Store Visits & Brand Lift Study - APAC EMEA LATAM', Budget: { Amount: 50000, Type: 'DailyStandard', Id: 5005, Name: 'Enterprise Global Shared Budget 2026' }, DeliveryStatus: 'CampaignConversionTagUnverified', DeliveryStatusDetails: ['CampaignConversionTagUnverified'], BiddingScheme: { Type: 'MaxConversions' }, PerformanceMetrics: { Clicks: 0, ConversionsCredit: 0 }, GoalStatusDetails: [{ GoalDeliveryStatus: 'NoEligibleGoal' }] },

      { Id: 1017, Status: 'Active', Name: 'B2B LinkedIn Audience Expansion Search', Budget: { Amount: 2000, Type: 'DailyStandard' }, DeliveryStatus: 'InlineOpportunity', BiddingScheme: { Type: 'TargetRoas' }, PerformanceMetrics: { Clicks: 456, ConversionsCredit: 34.25 }, GoalStatusDetails: [{ GoalDeliveryStatus: 'NoRecentOfflineConversion' }] },
      { Id: 1018, Status: 'Paused', Name: 'Broad Match', Budget: { Amount: 35, Type: 'DailyStandard' }, DeliveryStatus: 'Eligible', BiddingScheme: { Type: 'ManualCpc' }, PerformanceMetrics: { Clicks: 89, ConversionsCredit: 5.75 }, HasBudgetSuggestion: true },
    ];

    // ── Formatting Helpers ─────────────────────────────────────────

    const fmtCurrency = (amount, currency = 'USD') =>
      new Intl.NumberFormat('en-US', { style: 'currency', currency, minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount);

    const fmtInteger = (n) =>
      new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 }).format(n);

    const fmtDecimal = (n) =>
      new Intl.NumberFormat('en-US', { maximumFractionDigits: 2, minimumFractionDigits: 2 }).format(n);

    // ── ActionSlotCell ─────────────────────────────────────────────

    const ActionSlotCell = ({ children, alignment, config, hoverAction, restingAction, columnHasHover, columnRestingCount }) => {
      const isRight = alignment === 'right';
      const actionOrder = isRight ? config.rightAlignedActionOrder : config.leftAlignedActionOrder;
      const hoverAlignment = isRight ? config.rightAlignedHoverAlignment : config.leftAlignedHoverAlignment;
      const restingAlignment = isRight ? config.rightAlignedRestingAlignment : config.leftAlignedRestingAlignment;
      const hideResting = config.hideRestingActions;

      // Normalize restingAction: support single element or array (null elements become spacers)
      const restingList = Array.isArray(restingAction)
        ? restingAction
        : (restingAction != null ? [restingAction] : []);

      const hasHover = !!hoverAction;
      const hasResting = restingList.some(a => !!a) && !hideResting;

      // Column-level metadata for consistent padding across rows
      const effectiveHasHover = columnHasHover ?? hasHover;
      const effectiveRestingCount = columnRestingCount ?? restingList.length;

      const resolveEdge = (actionAlignment) => {
        if (actionAlignment === 'inline') return isRight ? 'inline-left' : 'inline-right';
        return actionAlignment;
      };

      const hoverEdge = resolveEdge(hoverAlignment);
      const restingEdge = resolveEdge(restingAlignment);

      // Build ordered slots for each position bucket.
      // When both actions target the same position, reserve a spacer for
      // whichever action is absent so the other stays at a fixed offset.
      const sameEdge = hoverEdge === restingEdge;

      const buildSlots = () => {
        const hoverSlots = effectiveHasHover ? [{ type: 'hover', edge: hoverEdge }] : [];
        const restingSlots = Array.from({ length: effectiveRestingCount }, (_, i) =>
          ({ type: 'resting', edge: restingEdge, index: i }));

        const ordered = actionOrder === 'resting-first'
          ? [...restingSlots, ...hoverSlots]
          : [...hoverSlots, ...restingSlots];

        return ordered.map(slot => {
          const isInline = slot.edge === 'inline-left' || slot.edge === 'inline-right';
          if (slot.type === 'hover') {
            if (hasHover) return { ...slot, el: hoverAction, render: 'hover' };
            if ((sameEdge && hasResting) || isInline) return { ...slot, el: null, render: 'spacer' };
            return null;
          } else {
            const el = slot.index < restingList.length ? restingList[slot.index] : null;
            if (!!el && !hideResting) return { ...slot, el, render: 'resting' };
            if (effectiveRestingCount > 1 || (sameEdge && effectiveHasHover) || isInline) return { ...slot, el: null, render: 'spacer' };
            return null;
          }
        }).filter(Boolean);
      };

      const slots = buildSlots();

      // Group slots by position bucket
      const buckets = { 'left-edge': [], 'right-edge': [], 'inline-left': [], 'inline-right': [] };
      for (const slot of slots) {
        buckets[slot.edge].push(slot);
      }

      // Ensure inline buckets always reserve space for 2 actions.
      // Place padding spacers on the EDGE side (away from content) so the
      // real action stays adjacent to content with only the 4px gap.
      for (const pos of ['inline-left', 'inline-right']) {
        while (buckets[pos].length > 0 && buckets[pos].length < 2) {
          const padSlot = { type: 'pad', edge: pos, render: 'spacer' };
          if (pos === 'inline-left') {
            buckets[pos].unshift(padSlot);
          } else {
            buckets[pos].push(padSlot);
          }
        }
      }

      const renderBucket = (bucket, position) => {
        if (bucket.length === 0) return null;
        const isAbsolute = position === 'left-edge' || position === 'right-edge';
        const clsBase = isAbsolute ? (position === 'left-edge' ? 'abs-left' : 'abs-right') : '';
        const slotWidth = isAbsolute ? '24px' : undefined;
        return (
          <div className={`action-wrapper ${clsBase}`} style={{ display: 'flex', gap: '0px' }}>
            {bucket.map((slot, i) => {
              if (slot.render === 'spacer') {
                return <div key={i} style={{ width: slotWidth || '24px', flexShrink: 0 }} />;
              }
              return (
                <div key={i} className={slot.render === 'hover' ? 'hover-action' : ''}
                  style={slotWidth ? { width: slotWidth, flexShrink: 0, overflow: 'visible', display: 'flex', justifyContent: 'center' } : undefined}>
                  {slot.el}
                </div>
              );
            })}
          </div>
        );
      };

      const hiddenRestingEl = restingAction && hideResting ? (
        <div className="action-wrapper hidden">{restingAction}</div>
      ) : null;

      // Compute padding for absolute-positioned actions based on CONFIGURED
      // alignment, not per-row presence. This ensures all rows in a column
      // reserve the same edge space, so content stays at a consistent width.
      let leftEdgeReserved = 0;
      let rightEdgeReserved = 0;
      if (effectiveHasHover && hoverEdge === 'left-edge') leftEdgeReserved++;
      if (effectiveRestingCount > 0 && restingEdge === 'left-edge') leftEdgeReserved += effectiveRestingCount;
      if (effectiveHasHover && hoverEdge === 'right-edge') rightEdgeReserved++;
      if (effectiveRestingCount > 0 && restingEdge === 'right-edge') rightEdgeReserved += effectiveRestingCount;

      const padClass = (count, side) => {
        if (count >= 3) return `pad-${side}-108`;
        if (count >= 2) return `pad-${side}-72`;
        if (count >= 1) return `pad-${side}-36`;
        return '';
      };
      const contentGroupCls = [
        'content-group',
        isRight ? 'content-group-right' : 'content-group-left',
        padClass(leftEdgeReserved, 'left'),
        padClass(rightEdgeReserved, 'right'),
      ].filter(Boolean).join(' ');

      return (
        <div className={`cell-container ${isRight ? 'cell-right' : 'cell-left'}`}>
          {renderBucket(buckets['left-edge'], 'left-edge')}
          <div className={contentGroupCls}>
            {renderBucket(buckets['inline-left'], 'inline-left')}
            <div className="cell-content">{children}</div>
            {renderBucket(buckets['inline-right'], 'inline-right')}
          </div>
          {renderBucket(buckets['right-edge'], 'right-edge')}
          {hiddenRestingEl}
        </div>
      );
    };

    // ── Cell Renderers ─────────────────────────────────────────────

    const StatusCell = ({ item }) => {
      const isActive = item.Status === 'Active';
      return (
        <div className="status-container">
          {isActive
            ? <PresenceAvailable10Filled style={{ fontSize: '10px', color: '#13a10e' }} />
            : <Pause16Filled style={{ fontSize: '10px', color: '#707070' }} />}
        </div>
      );
    };

    const CampaignNameCell = ({ item, config }) => {
      const hoverAction = (
        <Button appearance="subtle" size="small" icon={<Edit20Regular />} aria-label="Edit campaign name" />
      );
      const restingAction = item.IsNew ? (
        <Button appearance="subtle" size="small"
          icon={<Sparkle20Regular className="fluctuation-icon" />}
          aria-label="New campaign" style={{ opacity: 1 }}
        />
      ) : undefined;

      return (
        <ActionSlotCell alignment="left" config={config} hoverAction={hoverAction} restingAction={restingAction}
          columnHasHover={true} columnRestingCount={1}>
          <a href="#" className="name-link" onClick={e => e.preventDefault()}>
            <span className="name-text">{item.Name}</span>
          </a>
        </ActionSlotCell>
      );
    };

    const BID_LANDSCAPE_TYPES = ['ManualCpc', 'EnhancedCpc'];

    const BudgetCell = ({ item, config }) => {
      const hasBidLandscape = BID_LANDSCAPE_TYPES.includes(item.BiddingScheme?.Type || '');
      const hoverAction = (
        <Button appearance="subtle" size="small" icon={<Edit20Regular />} aria-label="Edit budget" />
      );
      const restingAction = hasBidLandscape ? (
        <Button appearance="subtle" size="small"
          icon={<ArrowTrendingLines20Regular className="landscape-icon" />}
          aria-label="Campaign bid landscape" style={{ opacity: 1 }}
        />
      ) : undefined;

      return (
        <ActionSlotCell alignment="right" config={config} hoverAction={hoverAction} restingAction={restingAction}
          columnHasHover={true} columnRestingCount={1}>
          <div className="budget-wrapper">
            <span style={{ fontSize: '12px' }}>{fmtCurrency(item.Budget.Amount)} / day</span>
            {item.Budget.Name && (
              <span className="budget-name">{item.Budget.Name}</span>
            )}
          </div>
        </ActionSlotCell>
      );
    };

    const DELIVERY_STATUS_TEXT = {
      Eligible: 'Eligible',
      EditorialRejected: 'Rejected',
      CampaignConversionTagUnverified: 'Tag unverified',
      InlineOpportunity: 'Eligible',
    };
    const ERROR_STATUSES = ['EditorialRejected', 'CampaignConversionTagUnverified'];
    const NORMAL_STATUSES = ['Eligible', 'InlineOpportunity'];

    const DeliveryCell = ({ item, config }) => {
      const status = item.DeliveryStatus;
      const text = DELIVERY_STATUS_TEXT[status] || status;
      const isError = ERROR_STATUSES.includes(status);
      const isNormal = NORMAL_STATUSES.includes(status);

      let badgeColor = 'warning';
      let badgeAppearance = 'tint';
      if (isError) { badgeColor = 'danger'; badgeAppearance = 'tint'; }
      else if (isNormal) { badgeColor = 'informative'; badgeAppearance = 'ghost'; }

      const restingAction = item.HasBudgetSuggestion ? (
        <ArrowTrendingLines20Regular className="suggestion-icon" aria-label="View budget recommendations" />
      ) : undefined;

      return (
        <ActionSlotCell alignment="left" config={config} restingAction={restingAction}
          columnHasHover={false} columnRestingCount={1}>
          <Badge appearance={badgeAppearance} size="large" shape="circular" color={badgeColor}>
            {text}
          </Badge>
        </ActionSlotCell>
      );
    };

    const ClicksCell = ({ item, config }) => {
      const hasFluctuation = item.AvailableInsightTypeIds?.includes('2') ?? false;
      const restingAction = hasFluctuation ? (
        <Button appearance="subtle" size="small"
          icon={<LightbulbFilament20Regular className="fluctuation-icon" />}
          aria-label="View insights" style={{ opacity: 1 }}
        />
      ) : undefined;

      return (
        <ActionSlotCell alignment="right" config={config} restingAction={restingAction}
          columnHasHover={false} columnRestingCount={1}>
          <span className="cell-value" style={{ fontSize: '12px' }}>
            {fmtInteger(item.PerformanceMetrics.Clicks)}
          </span>
        </ActionSlotCell>
      );
    };

    const WARN_STATUSES = ['NoEligibleGoal', 'TagUnverified', 'TagInactive', 'NoRecentOfflineConversion'];

    const ConversionsCell = ({ item, config }) => {
      const hasWarning = item.GoalStatusDetails?.some(
        g => WARN_STATUSES.includes(g.GoalDeliveryStatus)
      ) ?? false;
      const hasGoal = item.PerformanceMetrics.ConversionsCredit > 50;

      const warningAction = hasWarning ? (
        <Badge size="large" appearance="ghost" color="danger" icon={<Warning20Regular />} />
      ) : null;
      const goalAction = hasGoal ? (
        <Button appearance="subtle" size="small"
          icon={<LightbulbFilament20Regular className="fluctuation-icon" />}
          aria-label="View conversion goal" style={{ opacity: 1 }}
        />
      ) : null;

      const restingAction = [warningAction, goalAction];

      return (
        <ActionSlotCell alignment="right" config={config} restingAction={restingAction}
          columnHasHover={false} columnRestingCount={2}>
          <span className="cell-value" style={{ fontSize: '12px' }}>
            {fmtDecimal(item.PerformanceMetrics.ConversionsCredit)}
          </span>
        </ActionSlotCell>
      );
    };

    // ── Header Padding ─────────────────────────────────────────────

    const COLUMN_ACTION_MAP = {
      Name: { hasHover: true, hasResting: true, alignment: 'left' },
      Delivery: { hasHover: false, hasResting: true, alignment: 'left' },
      Budget: { hasHover: true, hasResting: true, alignment: 'right' },
      Clicks: { hasHover: false, hasResting: true, alignment: 'right' },
      ConversionsCredit: { hasHover: false, restingCount: 2, alignment: 'right' },
    };

    function computeHeaderPadding(columnId, config) {
      const meta = COLUMN_ACTION_MAP[columnId];
      if (!meta) return {};
      const isRight = meta.alignment === 'right';
      const hoverAlignment = isRight ? config.rightAlignedHoverAlignment : config.leftAlignedHoverAlignment;
      const restingAlignment = isRight ? config.rightAlignedRestingAlignment : config.leftAlignedRestingAlignment;
      let paddingRight = 0;
      let paddingLeft = 0;
      const addPad = (alignment) => {
        if (alignment === 'left-edge') paddingLeft += 36;
        else if (alignment === 'right-edge') paddingRight += 36;
      };
      if (meta.hasHover) addPad(hoverAlignment);
      const restingCount = meta.restingCount || (meta.hasResting ? 1 : 0);
      for (let i = 0; i < restingCount; i++) addPad(restingAlignment);
      return {
        ...(paddingRight > 0 && { paddingRight: `${paddingRight}px` }),
        ...(paddingLeft > 0 && { paddingLeft: `${paddingLeft}px` }),
      };
    }

    // ── ActionSlotGrid ─────────────────────────────────────────────

    const ActionSlotGrid = ({ data, config }) => {
      const [selectedIds, setSelectedIds] = useState(new Set());
      const allIds = useMemo(() => data.map(r => r.Id), [data]);
      const allSelected = selectedIds.size === data.length && data.length > 0;
      const someSelected = selectedIds.size > 0 && !allSelected;

      const toggleSelectAll = () => {
        setSelectedIds(allSelected ? new Set() : new Set(allIds));
      };
      const toggleRow = (id) => {
        setSelectedIds(prev => {
          const next = new Set(prev);
          next.has(id) ? next.delete(id) : next.add(id);
          return next;
        });
      };

      const nameHeaderPad = computeHeaderPadding('Name', config);
      const budgetHeaderPad = computeHeaderPadding('Budget', config);
      const deliveryHeaderPad = computeHeaderPadding('Delivery', config);
      const clicksHeaderPad = computeHeaderPadding('Clicks', config);
      const convHeaderPad = computeHeaderPadding('ConversionsCredit', config);

      return (
        <Table aria-label="Action slot demo grid" style={{ minWidth: '900px' }}>
          <TableHeader>
            <TableRow>
              <TableHeaderCell className="col-checkbox">
                <Checkbox
                  checked={allSelected ? true : someSelected ? 'mixed' : false}
                  onChange={toggleSelectAll}
                  aria-label="Select all"
                />
              </TableHeaderCell>
              <TableHeaderCell className="col-status" button={{ as: 'button', onClick: () => {} }} />
              <TableHeaderCell className="col-name" button={{ as: 'button', onClick: () => {}, style: nameHeaderPad }}>Campaign name</TableHeaderCell>
              <TableHeaderCell className="col-budget" button={{ as: 'button', onClick: () => {}, style: budgetHeaderPad }}>Daily budget</TableHeaderCell>
              <TableHeaderCell className="col-delivery" button={{ as: 'button', onClick: () => {}, style: deliveryHeaderPad }}>Delivery</TableHeaderCell>
              <TableHeaderCell className="col-clicks" button={{ as: 'button', onClick: () => {}, style: clicksHeaderPad }}>Clicks</TableHeaderCell>
              <TableHeaderCell className="col-conv" button={{ as: 'button', onClick: () => {}, style: convHeaderPad }}>Conv.</TableHeaderCell>
            </TableRow>
          </TableHeader>
          <TableBody>
            {data.map(item => (
              <TableRow
                key={item.Id}
                className={`data-row${selectedIds.has(item.Id) ? ' selected' : ''}`}
                appearance={selectedIds.has(item.Id) ? 'brand' : undefined}
              >
                <TableCell className="col-checkbox">
                  <Checkbox
                    checked={selectedIds.has(item.Id)}
                    onChange={() => toggleRow(item.Id)}
                    aria-label={`Select ${item.Name}`}
                  />
                </TableCell>
                <TableCell className="col-status"><StatusCell item={item} /></TableCell>
                <TableCell className="col-name"><CampaignNameCell item={item} config={config} /></TableCell>
                <TableCell className="col-budget"><BudgetCell item={item} config={config} /></TableCell>
                <TableCell className="col-delivery"><DeliveryCell item={item} config={config} /></TableCell>
                <TableCell className="col-clicks"><ClicksCell item={item} config={config} /></TableCell>
                <TableCell className="col-conv"><ConversionsCell item={item} config={config} /></TableCell>
              </TableRow>
            ))}
          </TableBody>
        </Table>
      );
    };

    // ── ControlsPanel ──────────────────────────────────────────────

    const ACTION_ORDER_OPTIONS = [
      { value: 'hover-first', label: 'Hover first, Resting after' },
      { value: 'resting-first', label: 'Resting first, Hover after' },
    ];

    const ALIGNMENT_OPTIONS = [
      { value: 'left-edge', label: 'Left edge' },
      { value: 'right-edge', label: 'Right edge' },
      { value: 'inline', label: 'Inline' },
    ];

    const ConfigDropdown = ({ label, value, options, onChange }) => (
      <div className="control-group">
        <Label weight="semibold">{label}</Label>
        <Dropdown
          value={options.find(o => o.value === value)?.label}
          selectedOptions={[value]}
          onOptionSelect={(_, data) => onChange(data.optionValue)}
          style={{ minWidth: '180px' }}
        >
          {options.map(o => <Option key={o.value} value={o.value}>{o.label}</Option>)}
        </Dropdown>
      </div>
    );

    const ControlsPanel = ({ config, onChange }) => {
      return (
        <div className="controls-panel">
          <Accordion collapsible defaultOpenItems={['controls']}>
            <AccordionItem value="controls">
              <AccordionHeader>Customize Action Slot Behavior</AccordionHeader>
              <AccordionPanel>
                <div className="controls-grid">
                  <div className="controls-section">
                    <div className="controls-section-header">Left-aligned cells</div>
                    <ConfigDropdown
                      label="Hover action alignment"
                      value={config.leftAlignedHoverAlignment}
                      options={ALIGNMENT_OPTIONS}
                      onChange={v => onChange({ ...config, leftAlignedHoverAlignment: v })}
                    />
                    <ConfigDropdown
                      label="Resting action alignment"
                      value={config.leftAlignedRestingAlignment}
                      options={ALIGNMENT_OPTIONS}
                      onChange={v => onChange({ ...config, leftAlignedRestingAlignment: v })}
                    />
                    {config.leftAlignedHoverAlignment === config.leftAlignedRestingAlignment && (
                      <ConfigDropdown
                        label="Cell action order"
                        value={config.leftAlignedActionOrder}
                        options={ACTION_ORDER_OPTIONS}
                        onChange={v => onChange({ ...config, leftAlignedActionOrder: v })}
                      />
                    )}
                  </div>
                  <div className="controls-section">
                    <div className="controls-section-header">Right-aligned cells</div>
                    <ConfigDropdown
                      label="Hover action alignment"
                      value={config.rightAlignedHoverAlignment}
                      options={ALIGNMENT_OPTIONS}
                      onChange={v => onChange({ ...config, rightAlignedHoverAlignment: v })}
                    />
                    <ConfigDropdown
                      label="Resting action alignment"
                      value={config.rightAlignedRestingAlignment}
                      options={ALIGNMENT_OPTIONS}
                      onChange={v => onChange({ ...config, rightAlignedRestingAlignment: v })}
                    />
                    {config.rightAlignedHoverAlignment === config.rightAlignedRestingAlignment && (
                      <ConfigDropdown
                        label="Cell action order"
                        value={config.rightAlignedActionOrder}
                        options={ACTION_ORDER_OPTIONS}
                        onChange={v => onChange({ ...config, rightAlignedActionOrder: v })}
                      />
                    )}
                  </div>
                </div>
              </AccordionPanel>
            </AccordionItem>
          </Accordion>
        </div>
      );
    };

    // ── App ────────────────────────────────────────────────────────

    const App = () => {
      const [activePresetId, setActivePresetId] = useState('aesthetics');
      const [config, setConfig] = useState({ ...PRESETS[0].config, hideRestingActions: false });

      const activePreset = PRESETS.find(p => p.id === activePresetId);
      const isModified = activePreset && Object.keys(activePreset.config).some(
        k => config[k] !== activePreset.config[k]
      );

      const selectPreset = (preset) => {
        setActivePresetId(preset.id);
        setConfig(prev => ({ ...preset.config, hideRestingActions: prev.hideRestingActions }));
      };

      return (
        <div className="app-root">
          <div className="app-header">
            <h2>Action Slot Grid Prototype</h2>
            <span className="subtitle">
              Configure how resting and hover actions are positioned within grid cells
            </span>
          </div>
          <div className="preset-bar">
            <div className="preset-bar-top">
              <div className="preset-bar-left">
                <div className="preset-label">Best presets for specified goals</div>
                <div className="preset-buttons">
                  {PRESETS.map(p => (
                    <Button
                      key={p.id}
                      size="small"
                      appearance={activePresetId === p.id ? 'primary' : 'secondary'}
                      onClick={() => selectPreset(p)}
                    >
                      {p.label}{activePresetId === p.id && isModified ? ' (modified)' : ''}
                    </Button>
                  ))}
                  {isModified && (
                    <Button
                      size="small"
                      appearance="subtle"
                      onClick={() => setConfig(prev => ({ ...activePreset.config, hideRestingActions: prev.hideRestingActions }))}
                    >
                      Reset
                    </Button>
                  )}
                </div>
              </div>
              <div className="preset-bar-right">
                <Switch
                  label="Hide resting actions"
                  checked={config.hideRestingActions}
                  onChange={(_, data) => setConfig(prev => ({ ...prev, hideRestingActions: data.checked }))}
                />
              </div>
            </div>
            <div className="preset-description">
              {activePreset?.description}
            </div>
          </div>
          <div className="grid-area">
            <ActionSlotGrid data={mockCampaigns} config={config} />
          </div>
          <ControlsPanel config={config} onChange={setConfig} />
        </div>
      );
    };

    // ── Mount ──────────────────────────────────────────────────────

    createRoot(document.getElementById('root')).render(
      <FluentProvider theme={webLightTheme} style={{ height: '100%' }}>
        <App />
      </FluentProvider>
    );
  </script>
</body>
</html>
